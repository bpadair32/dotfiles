# Terminal settings
term xterm-256color
shell /bin/zsh

# Font settings
font_family JetBrainsMonoNL Nerd Font
font_size 10.0
bold_font auto
italic_font auto
bold_italic_font auto

# Window settings
window_padding_width 10
hide_window_decorations yes
background_opacity 0.9
dynamic_background_opacity yes
background_blur 64

# Theme (approximately matching alabaster_dark)
# You may want to fine-tune these colors
# foreground #cccccc
# background #0e1415
# cursor #cccccc

# Normal colors
# color0 #000000
# color1 #e25d56
# color2 #73ca50
# color3 #e9bf57
# color4 #4a88e4
# color5 #915caf
# color6 #23acdd
# color7 #cccccc

# Bright colors
# color8 #676767
# color9 #f36868
# color10 #88db3f
# color11 #f0bf7a
# color12 #6f8fdb
# color13 #e987e9
# color14 #4ed9e9
# color15 #f5f5f5

# Inside tmux: kitty's own copy/scrollback keys have nothing to act on (tmux
# owns the screen), so hand them to tmux as private sequences it binds as
# User0-7 (see tmux.conf). tmux titles the window "tmux: ..." while attached;
# outside tmux these maps are inactive and the defaults apply.
map --when-focus-on title:^tmux: ctrl+shift+c         send_text all \x1b[9000~
map --when-focus-on title:^tmux: ctrl+shift+up        send_text all \x1b[9001~
map --when-focus-on title:^tmux: ctrl+shift+k         send_text all \x1b[9001~
map --when-focus-on title:^tmux: ctrl+shift+down      send_text all \x1b[9002~
map --when-focus-on title:^tmux: ctrl+shift+j         send_text all \x1b[9002~
map --when-focus-on title:^tmux: ctrl+shift+page_up   send_text all \x1b[9003~
map --when-focus-on title:^tmux: ctrl+shift+page_down send_text all \x1b[9004~
map --when-focus-on title:^tmux: ctrl+shift+home      send_text all \x1b[9005~
map --when-focus-on title:^tmux: ctrl+shift+end       send_text all \x1b[9006~
map --when-focus-on title:^tmux: ctrl+shift+h         send_text all \x1b[9007~

# Advanced settings
allow_remote_control yes
enable_audio_bell no
update_check_interval 0

# Debug
debug_keyboard yes
debug_font_fallback yes

include colors.conf


# BEGIN_KITTY_THEME
# Your-Theme
include current-theme.conf
# END_KITTY_THEME