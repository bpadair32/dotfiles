# Set true color
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB:hyperlinks'

# Title the kitty window "tmux: ..." while attached. kitty.conf keys its
# tmux-only mappings off this prefix; kitty's shell integration resets the
# title when tmux exits, so the mappings switch back off on their own.
set -g set-titles on
set -g set-titles-string 'tmux: #S / #W'
# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Some more sensible defaults and settings
set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi 

#Split panes with | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Switch panes with vim motions
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Easier refresh of tmux config
unbind r
bind r source-file ~/.tmux.conf

# Reset pane sizing
bind -r m resize-pane -Z

# Show keybinds in a popup with fzf
bind ? display-popup -E -w 80% -h 80% "grep -E '^(bind|set -g @.*-bind)' ~/.tmux.conf | fzf --reverse --header='Custom Tmux Keybindings'"

# Enable mouse support
set -g mouse on

# ---- Behave like bare kitty -------------------------------------------------
# kitty: selecting text fills PRIMARY (middle-click pastes it); only
# Ctrl+Shift+C puts it on the clipboard. The mouse bindings below mirror
# tmux's defaults but "pipe" instead of "copy-pipe", so a selection goes to
# PRIMARY and never into a tmux buffer - a buffer copy would also push it to
# the clipboard through set-clipboard.

# A mouse selection stays highlighted until you do something else, like
# kitty. Keeping the highlight means staying in copy mode, which would
# swallow typing, so each selection also switches the client to the
# "mousesel" key table (below): the next key clears the highlight and is then
# replayed through the normal key tables, so it reaches the shell or fires
# its tmux binding as if copy mode had never been there.
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection \; send -X pipe-no-clear 'wl-copy --primary' \; set -gF @mousesel_pane '#{pane_id}' \; switch-client -T mousesel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X stop-selection \; send -X pipe-no-clear 'wl-copy --primary' \; set -gF @mousesel_pane '#{pane_id}' \; switch-client -T mousesel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X stop-selection \; send -X pipe-no-clear 'wl-copy --primary' \; set -gF @mousesel_pane '#{pane_id}' \; switch-client -T mousesel
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-word ; send -X stop-selection ; send -X pipe-no-clear 'wl-copy --primary' ; set -gF @mousesel_pane '#{pane_id}' ; switch-client -T mousesel }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-line ; send -X stop-selection ; send -X pipe-no-clear 'wl-copy --primary' ; set -gF @mousesel_pane '#{pane_id}' ; switch-client -T mousesel }

# While a mouse selection is showing. Anything that keeps the selection must
# re-enter this table, because tmux drops back to root after every key. The
# highlighted pane is remembered in @mousesel_pane: inside a mouse binding the
# "current" pane is the one under the mouse, so a click in another pane could
# not otherwise reach it. Each cancel checks pane_in_mode first because a
# failing command aborts the rest of the sequence, which would eat the
# replayed key.
bind -T mousesel Any run -C "if -F -t '#{@mousesel_pane}' '##{pane_in_mode}' { send -t '#{@mousesel_pane}' -X cancel }" \; switch-client -T root \; send-keys -K
bind -T mousesel MouseDown1Pane run -C "if -F -t '#{@mousesel_pane}' '##{pane_in_mode}' { send -t '#{@mousesel_pane}' -X cancel }" \; select-pane -t =
bind -T mousesel DoubleClick1Pane select-pane -t = \; if -F '#{pane_in_mode}' { send -X select-word } { copy-mode -H ; send -X select-word } \; send -X stop-selection \; send -X pipe-no-clear 'wl-copy --primary' \; set -gF @mousesel_pane '#{pane_id}' \; switch-client -T mousesel
bind -T mousesel TripleClick1Pane select-pane -t = \; if -F '#{pane_in_mode}' { send -X select-line } { copy-mode -H ; send -X select-line } \; send -X stop-selection \; send -X pipe-no-clear 'wl-copy --primary' \; set -gF @mousesel_pane '#{pane_id}' \; switch-client -T mousesel
# A triple-click ends with one more button release; don't let it clear.
bind -T mousesel MouseUp1Pane switch-client -T mousesel
bind -T mousesel WheelUpPane select-pane -t = \; if -F '#{pane_in_mode}' { send -X -N 5 scroll-up } \; switch-client -T mousesel
bind -T mousesel WheelDownPane select-pane -t = \; if -F '#{pane_in_mode}' { send -X -N 5 scroll-down } \; switch-client -T mousesel
bind -T mousesel User0 if -F '#{selection_present}' { send -X pipe-no-clear 'wl-copy' } \; switch-client -T mousesel
bind -T mousesel User1 if -F '#{pane_in_mode}' { send -X scroll-up } \; switch-client -T mousesel
bind -T mousesel User2 if -F '#{pane_in_mode}' { send -X scroll-down } \; switch-client -T mousesel
bind -T mousesel User3 if -F '#{pane_in_mode}' { send -X page-up } \; switch-client -T mousesel
bind -T mousesel User4 if -F '#{pane_in_mode}' { send -X page-down } \; switch-client -T mousesel

# Middle-click pastes PRIMARY (not the last tmux buffer), bracketed.
bind -n MouseDown2Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { run -b "wl-paste --primary --no-newline | tmux load-buffer -b primary - && tmux paste-buffer -p -d -b primary -t '#{pane_id}'" }

# kitty's Ctrl+Shift keys. kitty grabs these itself, so kitty.conf re-sends
# them as these private sequences while the window title starts with "tmux:".
# Ctrl+Shift+V and Shift+Insert need nothing: kitty still pastes them.
set -s user-keys[0] "\e[9000~"
set -s user-keys[1] "\e[9001~"
set -s user-keys[2] "\e[9002~"
set -s user-keys[3] "\e[9003~"
set -s user-keys[4] "\e[9004~"
set -s user-keys[5] "\e[9005~"
set -s user-keys[6] "\e[9006~"
set -s user-keys[7] "\e[9007~"
# Ctrl+Shift+C: copy the keyboard selection if copy mode has one, else the
# last mouse selection (PRIMARY) - same as kitty.
bind -n User0 if -F '#{selection_present}' { send -X pipe-no-clear 'wl-copy' } { run -b 'wl-paste --primary --no-newline | wl-copy' }
# Ctrl+Shift+Up/K, Down/J, PgUp, PgDn, Home, End: scroll the pane's history.
# -e leaves copy mode once you scroll back to the bottom.
bind -n User1 if -F '#{pane_in_mode}' { send -X scroll-up } { copy-mode -e ; send -X scroll-up }
bind -n User2 if -F '#{pane_in_mode}' { send -X scroll-down }
bind -n User3 if -F '#{pane_in_mode}' { send -X page-up } { copy-mode -e ; send -X page-up }
bind -n User4 if -F '#{pane_in_mode}' { send -X page-down }
bind -n User5 if -F '#{pane_in_mode}' { send -X history-top } { copy-mode -e ; send -X history-top }
bind -n User6 if -F '#{pane_in_mode}' { send -X cancel }
# Ctrl+Shift+H: the pane's whole history in less, like kitty's scrollback pager.
bind -n User7 display-popup -E -w 90% -h 90% "tmux capture-pane -p -e -J -S - -t '#{pane_id}' | less -R +G"

# Make some keybinds in nvim work right
set -s extended-keys on
set-option -g xterm-keys on
set -as terminal-features 'xterm*:extkeys'
set-option -g allow-passthrough on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'p'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# Colours and status bar, generated by theme-switch from
# templates/tmux-colors.conf.tmpl. Last, so no plugin can override it.
source-file -q ~/.config/tmux/colors.conf
