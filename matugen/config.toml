# matugen is used only to turn a wallpaper into a Material You palette.
# It writes that palette out as a theme.toml in the same format as the
# static themes, and theme-switch then runs it through the normal
# apply_theme pipeline. Keeping a second set of matugen-specific
# templates here is what previously left matugen themes missing GTK, Qt,
# dunst, SDDM and Neovim.

# [config] must be present even when empty. There is deliberately no
# [config.wallpaper] here: theme-switch sets the wallpaper itself from the
# wallpaper key in the generated theme.toml.
[config]

[templates.theme]
input_path = "./templates/theme.toml"
output_path = "~/repos/dotfiles/themes/_dynamic/matugen/theme.toml"
